<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog Pro — Tistory HTML Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-icon">✦</span>
          <span class="logo-text">Blog Pro</span>
        </div>
        <p class="logo-sub">Tistory HTML Generator</p>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-label">설정</div>

        <div class="form-group">
          <label for="tone">글 톤</label>
          <select id="tone">
            <option value="정보 전달형">정보 전달형</option>
            <option value="친근한 대화체">친근한 대화체</option>
            <option value="전문적 분석형">전문적 분석형</option>
            <option value="리뷰형">리뷰형</option>
            <option value="튜토리얼형">튜토리얼형</option>
            <option value="감성적 에세이">감성적 에세이</option>
          </select>
        </div>

        <div class="form-group">
          <label for="length">글 분량</label>
          <div class="radio-group">
            <label class="radio-item">
              <input type="radio" name="length" value="short" />
              <span class="radio-label">짧게</span>
              <span class="radio-sub">~500자</span>
            </label>
            <label class="radio-item">
              <input type="radio" name="length" value="medium" checked />
              <span class="radio-label">보통</span>
              <span class="radio-sub">~1000자</span>
            </label>
            <label class="radio-item">
              <input type="radio" name="length" value="long" />
              <span class="radio-label">길게</span>
              <span class="radio-sub">~1800자</span>
            </label>
          </div>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="token-badge" id="tokenBadge" style="display:none">
          <span class="token-icon">⚡</span>
          <span id="tokenCount">0</span> tokens used
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main">

      <!-- Top Bar -->
      <header class="topbar">
        <div class="topbar-left">
          <h1 class="page-title">새 포스트 생성</h1>
          <p class="page-sub">주제를 입력하고 AI가 Tistory용 HTML을 작성합니다</p>
        </div>
        <div class="topbar-right">
          <div class="status-dot" id="statusDot"></div>
          <span class="status-text" id="statusText">대기 중</span>
        </div>
      </header>

      <!-- Topic Input -->
      <section class="input-section">
        <div class="input-wrapper">
          <div class="input-icon">✦</div>
          <textarea
            id="topicInput"
            class="topic-input"
            placeholder="블로그 주제를 입력하세요&#10;예) 파이썬으로 웹 크롤링하는 방법, 미니멀 라이프 시작하기, 제주도 3박4일 여행기..."
            rows="3"
            maxlength="200"
          ></textarea>
          <div class="input-footer">
            <span class="char-count"><span id="charCount">0</span>/200</span>
            <button id="generateBtn" class="btn-generate">
              <span class="btn-text">생성하기</span>
              <span class="btn-icon">→</span>
            </button>
          </div>
        </div>
      </section>

      <!-- Output Section -->
      <section class="output-section" id="outputSection">

        <!-- Tab Bar -->
        <div class="tab-bar">
          <button class="tab active" data-tab="source">
            <span>HTML 소스</span>
          </button>
          <button class="tab" data-tab="preview">
            <span>미리보기</span>
          </button>
          <div class="tab-actions">
            <button class="btn-icon-only" id="copyBtn" title="클립보드에 복사">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
              <span>복사</span>
            </button>
            <button class="btn-icon-only" id="downloadBtn" title="HTML 파일 다운로드">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
              <span>다운로드</span>
            </button>
          </div>
        </div>

        <!-- Output Panels -->
        <div class="output-panels">
          <div class="panel active" id="panel-source">
            <div class="empty-state" id="emptyState">
              <div class="empty-icon">✦</div>
              <p>주제를 입력한 후 <strong>생성하기</strong> 버튼을 누르세요</p>
            </div>
            <div class="loading-state" id="loadingState" style="display:none">
              <div class="spinner"></div>
              <p>AI가 블로그 콘텐츠를 작성 중입니다...</p>
            </div>
            <pre class="code-output" id="htmlOutput" style="display:none"></pre>
          </div>

          <div class="panel" id="panel-preview">
            <div class="preview-frame" id="previewFrame"></div>
          </div>
        </div>
      </section>

    </main>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
